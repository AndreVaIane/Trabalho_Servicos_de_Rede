<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Cadastrar Autor</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <nav style="background: #1C1D21; padding: 15px; text-align: center;">
        <a href="index.html" style="color: white; margin: 0 15px; text-decoration: none;">Início</a>
        <a href="cadastroAutor.html" style="color: #925FE2; margin: 0 15px; text-decoration: none; font-weight: bold;">Cadastrar Autor</a>
        <a href="cadastroLivro.html" style="color: white; margin: 0 15px; text-decoration: none;">Cadastrar Livro</a>
    </nav>
    <div class="cadastro">
        <div class="form">
            <div class="date">
                <h1>Novo Autor</h1>
                <input type="text" id="nome" placeholder="Nome do Autor">

                <button onclick="addAutor()">Cadastrar Autor</button>    
            </div>
        </div>
        <div class="imagem-autor"></div>
    </div>
    <script src="script.js"></script>
