<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biblioteca - Acervo</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <nav style="background: #1C1D21; padding: 15px; text-align: center;">
        <a href="index.html" style="color: #925FE2; margin: 0 15px; text-decoration: none; font-weight: bold;">Início</a>
        <a href="cadastroAutor.html" style="color: white; margin: 0 15px; text-decoration: none;">Cadastrar Autor</a>
        <a href="cadastroLivro.html" style="color: white; margin: 0 15px; text-decoration: none;">Cadastrar Livro</a>
    </nav>

    <div class="cadastro">
        <div class="form">
            <div class="date" style="justify-content: flex-start; padding-top: 40px;">
                <h1>Acervo Digital</h1>
                <p>Bem-vindo! Confira abaixo os títulos disponíveis em nossa biblioteca.</p>
                
                <ul id="lista" class="lista-home">
                    <li>Carregando acervo...</li>
                </ul>
            </div>
        </div>

        <div class="imagem-livros">
        </div>
    </div>

    <script>
        async function load() {
            try {
                const res = await fetch('/api/livros');
                const livros = await res.json();
                const lista = document.getElementById('lista');
                
                lista.innerHTML = ''; 
                
                if (livros.length === 0) {
                    lista.innerHTML = '<li>Nenhum livro encontrado.</li>';
                    return;
                }
                
                livros.forEach(l => {
                    lista.innerHTML += `
                        <li>
                            <span><strong>${l.titulo}</strong> (${l.ano})</span>
                            <span style="opacity: 0.6;">Autor ID: ${l.autor_id}</span>
                        </li>
                    `;
                });
            } catch (erro) {
                document.getElementById('lista').innerHTML = '<li style="color: #ff4d4d;">Erro ao carregar o banco de dados.</li>';
            }
        }
        load();
    </script>
</body>
</html>
