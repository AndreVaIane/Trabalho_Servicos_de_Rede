server {
    # Portas que o container vai escutar (conforme o mapeamento do docker-compose)
    listen 8080;
    listen 8443;

    server_name localhost;

    # 1. Frontend Estático: Serve os arquivos da pasta html
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # 2. Proxy Reverso: Encaminha tudo que começa com /api para o FastAPI
    location /api {
        # 'fastapi' é o nome do serviço definido no docker-compose
        proxy_pass http://fastapi:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Remove o prefixo /api antes de mandar para o FastAPI (opcional, depende da rota no Python)
        # rewrite ^/api/(.*)$ /$1 break;
    }
}