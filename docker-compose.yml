version: '3.8'

services:
  # 1. Banco de Dados (Isolado, sem expor portas ao hospedeiro)
  postgres:
    image: postgres:15-alpine
    container_name: postgres_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${SENHA_BANCO}
      POSTGRES_DB: biblioteca
    volumes:
      - dados-postgres:/var/lib/postgresql/data
    networks:
      - netatividade01

  # 2. Backend FastAPI (Depende do banco estar UP)
  fastapi:
    build: ./backend
    container_name: fastapi_backend
    restart: always
    depends_on:
      - postgres
    environment:
      # FastAPI usa essa URL para conectar no banco via rede interna
      - DATABASE_URL=postgresql://postgres:${SENHA_BANCO}@postgres:5432/biblioteca
    # No serviço fastapi, mude o volume para:
    volumes:
      - ./backend:/app  # Mapeia a pasta backend inteira
    networks:
      - netatividade01

  # 3. Proxy Reverso e Frontend estático (Único exposto ao hospedeiro)
  nginx:
    image: nginx:alpine
    container_name: nginx_proxy
    restart: always
    depends_on:
      - fastapi
    ports:
      - "80:8080"
      - "443:8443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/html:/usr/share/nginx/html:ro
    networks:
      - netatividade01

# Criação da rede exigida pela atividade
networks:
  netatividade01:
    name: netatividade01
    driver: bridge

# Criação do volume para persistência do banco
volumes:
  dados-postgres: